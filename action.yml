name: "tf-blast"
description: "Ultra-fast, zero-trust blast radius analyzer for Terraform and OpenTofu execution plans"
author: "smford"
branding:
  icon: "activity"
  color: "orange"

inputs:
  plan-file:
    description: "Path to the Terraform/OpenTofu JSON plan file"
    required: true
  fail-on:
    description: "Failure threshold (critical, high, replacement, any-destroy)"
    required: false
    default: ""
  max-blast:
    description: "Maximum acceptable blast radius before failing (0 = disabled)"
    required: false
    default: "0"
  max-score:
    description: "Maximum acceptable weighted blast score before failing (0 = disabled)"
    required: false
    default: "0"
  config:
    description: "Optional path to .tf-blast.yaml policy configuration"
    required: false
    default: ""
  out-file:
    description: "Path to write the Markdown report to"
    required: false
    default: "pr-comment.md"
  sarif-file:
    description: "Optional path to write SARIF 2.1.0 report for GitHub Code Scanning"
    required: false
    default: ""
  upload-sarif:
    description: "Whether to automatically upload SARIF report to GitHub Code Scanning"
    required: false
    default: "false"
  post-pr-comment:
    description: "Whether to automatically post or update a PR comment with the analysis"
    required: false
    default: "true"
  github-token:
    description: "GitHub token for posting PR comments"
    required: false
    default: ${{ github.token }}

outputs:
  report-file:
    description: "Path to the generated Markdown report file"
    value: ${{ inputs.out-file }}
  sarif-file:
    description: "Path to the generated SARIF report file"
    value: ${{ inputs.sarif-file }}
  exit-code:
    description: "Exit code of the tf-blast execution (0 = pass, 1 = policy violation)"
    value: ${{ steps.run-tf-blast.outputs.exit_code }}

runs:
  using: "composite"
  steps:
    - name: Ensure tf-blast is installed
      shell: bash
      run: |
        if command -v tf-blast >/dev/null 2>&1; then
          echo "tf-blast is already installed: $(tf-blast --version)"
          exit 0
        fi

        echo "Installing tf-blast..."

        OS=$(uname -s | tr '[:upper:]' '[:lower:]')
        ARCH=$(uname -m)
        case "$ARCH" in
          x86_64) ARCH="amd64" ;;
          aarch64|arm64) ARCH="arm64" ;;
        esac

        ACTION_REF="${{ github.action_ref }}"
        CANDIDATE_URLS=()
        if [ -z "$ACTION_REF" ] || [ "$ACTION_REF" = "main" ]; then
          CANDIDATE_URLS+=(
            "https://github.com/smford/tf-blast/releases/latest/download/tf-blast_${OS}_${ARCH}.tar.gz"
            "https://github.com/smford/tf-blast/releases/latest/download/tf-blast-${OS}-${ARCH}.tar.gz"
          )
        else
          TAG_NO_V="${ACTION_REF#v}"
          CANDIDATE_URLS+=(
            "https://github.com/smford/tf-blast/releases/download/${ACTION_REF}/tf-blast_${TAG_NO_V}_${OS}_${ARCH}.tar.gz"
            "https://github.com/smford/tf-blast/releases/download/${ACTION_REF}/tf-blast_${OS}_${ARCH}.tar.gz"
            "https://github.com/smford/tf-blast/releases/download/${ACTION_REF}/tf-blast-${OS}-${ARCH}.tar.gz"
          )
        fi

        INSTALL_DIR="/usr/local/bin"
        if [ ! -w "$INSTALL_DIR" ]; then
          INSTALL_DIR="$HOME/.local/bin"
          mkdir -p "$INSTALL_DIR"
          echo "$INSTALL_DIR" >> "$GITHUB_PATH"
        fi

        INSTALLED=false
        if command -v curl >/dev/null 2>&1 && command -v tar >/dev/null 2>&1; then
          for URL in "${CANDIDATE_URLS[@]}"; do
            echo "Attempting pre-built binary download from ${URL}..."
            if curl -sSL --fail "${URL}" -o /tmp/tf-blast.tar.gz 2>/dev/null; then
              tar -xzf /tmp/tf-blast.tar.gz -C "$INSTALL_DIR" tf-blast 2>/dev/null || tar -xzf /tmp/tf-blast.tar.gz -C "$INSTALL_DIR"
              chmod +x "${INSTALL_DIR}/tf-blast"
              rm -f /tmp/tf-blast.tar.gz
              INSTALLED=true
              echo "Pre-built binary installed successfully from ${URL}."
              break
            fi
          done
        fi

        if [ "$INSTALLED" = "false" ]; then
          if command -v go >/dev/null 2>&1; then
            echo "Building tf-blast from source using local Go toolchain..."
            cd "${{ github.action_path }}"
            go build -ldflags="-s -w" -o "${INSTALL_DIR}/tf-blast" ./cmd/tf-blast
            INSTALLED=true
          else
            echo "::error::Failed to download pre-built binary and Go compiler is not installed."
            exit 1
          fi
        fi

        echo "tf-blast installed successfully: $("${INSTALL_DIR}/tf-blast" --version)"

    - name: Run tf-blast Analysis
      id: run-tf-blast
      shell: bash
      run: |
        CMD_ARGS=(--output markdown --out-file "${{ inputs.out-file }}")

        if [ -n "${{ inputs.fail-on }}" ]; then
          CMD_ARGS+=(--fail-on "${{ inputs.fail-on }}")
        fi
        if [ "${{ inputs.max-blast }}" -gt 0 ]; then
          CMD_ARGS+=(--max-blast "${{ inputs.max-blast }}")
        fi
        if [ "${{ inputs.max-score }}" -gt 0 ]; then
          CMD_ARGS+=(--max-score "${{ inputs.max-score }}")
        fi
        if [ -n "${{ inputs.config }}" ]; then
          CMD_ARGS+=(--config "${{ inputs.config }}")
        fi

        set +e
        tf-blast "${CMD_ARGS[@]}" ${{ inputs.plan-file }}
        EXIT_CODE=$?
        set -e

        if [ -n "${{ inputs.sarif-file }}" ]; then
          tf-blast --output sarif --out-file "${{ inputs.sarif-file }}" -s ${{ inputs.plan-file }} || true
        fi

        echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

    - name: Post or Update PR Comment
      if: inputs.post-pr-comment == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          const commentFile = '${{ inputs.out-file }}';
          if (!fs.existsSync(commentFile)) {
            console.log('No comment file found, skipping PR comment.');
            return;
          }
          const body = fs.readFileSync(commentFile, 'utf8');
          const tag = '<!-- tf-blast-report -->';
          const fullBody = `${tag}\n${body}`;

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });

          const botComment = comments.find(c => c.body.includes(tag));
          if (botComment) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: botComment.id,
              body: fullBody,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: fullBody,
            });
          }

    - name: Upload SARIF to GitHub Code Scanning
      if: inputs.upload-sarif == 'true' && inputs.sarif-file != ''
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.sarif-file }}

    - name: Enforce Policy Gates
      shell: bash
      run: |
        if [ "${{ steps.run-tf-blast.outputs.exit_code }}" -ne 0 ]; then
          echo "::error::tf-blast policy check failed! Review the blast radius report for details."
          exit 1
        fi
