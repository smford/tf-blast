name: "Release & Publish"

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    name: "Semantic Version & Release"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Run Test Suite
        run: |
          go test -v ./...

      - name: Run Go Vulnerability Check
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Calculate Semantic Version
        id: semver
        run: |
          chmod +x scripts/bump-version.sh
          ./scripts/bump-version.sh

      - name: Check If Code Changes Require Release
        if: steps.semver.outputs.is_new_version != 'true'
        run: |
          echo "No code changes detected in cmd/, pkg/, or go dependencies since last release. Skipping release."

      - name: Configure Git User
        if: steps.semver.outputs.is_new_version == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Tag Release & Update Major Tag
        if: steps.semver.outputs.is_new_version == 'true'
        env:
          NEW_TAG: ${{ steps.semver.outputs.version }}
          MAJOR_TAG: ${{ steps.semver.outputs.major_tag }}
        run: |
          echo "Tagging release: ${NEW_TAG}"
          git tag -a "${NEW_TAG}" -m "Release ${NEW_TAG}"
          git push origin "${NEW_TAG}"

          if [ -n "${MAJOR_TAG}" ]; then
            echo "Updating floating major tag: ${MAJOR_TAG}"
            git tag -fa "${MAJOR_TAG}" -m "Update ${MAJOR_TAG} to ${NEW_TAG}"
            git push origin "${MAJOR_TAG}" --force
          fi

      - name: Build Cross-Platform Release Assets
        if: steps.semver.outputs.is_new_version == 'true'
        env:
          VERSION: ${{ steps.semver.outputs.version }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          chmod +x scripts/build-release.sh
          ./scripts/build-release.sh "${VERSION}" "${COMMIT_SHA:0:7}"

      - name: Publish GitHub Release
        if: steps.semver.outputs.is_new_version == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.semver.outputs.version }}
        run: |
          gh release create "${VERSION}" dist/* \
            --title "tf-blast ${VERSION}" \
            --generate-notes

      - name: Update Docs Release Metadata
        if: steps.semver.outputs.is_new_version == 'true'
        env:
          VERSION: ${{ steps.semver.outputs.version }}
          VERSION_NUM: ${{ steps.semver.outputs.version_number }}
        run: |
          mkdir -p docs
          python3 -c "
          import os, json, datetime
          v = os.environ['VERSION']
          v_num = os.environ['VERSION_NUM']
          repo = '${{ github.repository }}'
          data = {
              'version': v,
              'version_number': v_num,
              'released_at': datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
              'release_url': f'https://github.com/{repo}/releases/tag/{v}',
              'assets': {
                  'linux_amd64': f'https://github.com/{repo}/releases/download/{v}/tf-blast_{v_num}_linux_amd64.tar.gz',
                  'linux_arm64': f'https://github.com/{repo}/releases/download/{v}/tf-blast_{v_num}_linux_arm64.tar.gz',
                  'darwin_amd64': f'https://github.com/{repo}/releases/download/{v}/tf-blast_{v_num}_darwin_amd64.tar.gz',
                  'darwin_arm64': f'https://github.com/{repo}/releases/download/{v}/tf-blast_{v_num}_darwin_arm64.tar.gz',
                  'windows_amd64': f'https://github.com/{repo}/releases/download/{v}/tf-blast_{v_num}_windows_amd64.zip'
              }
          }
          with open('docs/version.json', 'w') as f:
              json.dump(data, f, indent=2)
          "
          git add docs/version.json
          git commit -m "chore(docs): update website release version to ${VERSION} [skip ci]" || true
          git push origin main || true

      - name: Generate and Publish Homebrew Formula
        if: steps.semver.outputs.is_new_version == 'true'
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG_NAME: ${{ steps.semver.outputs.version }}
          VERSION: ${{ steps.semver.outputs.version_number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/generate_formula.sh
          ./scripts/generate_formula.sh "$VERSION" "$TAG_NAME" "dist" "Formula/tf-blast.rb"

          # Upload formula asset to GitHub release
          gh release upload "$TAG_NAME" Formula/tf-blast.rb --clobber

          # Commit updated formula to tf-blast repository
          git add Formula/tf-blast.rb
          git commit -m "chore(formula): update Homebrew formula to ${TAG_NAME} [skip ci]" || true
          git push origin main || true

          # Publish to smford/homebrew-tap if HOMEBREW_TAP_TOKEN is configured
          if [ -n "${TAP_TOKEN}" ]; then
            echo "Publishing updated formula to smford/homebrew-tap..."
            git clone "https://x-access-token:${TAP_TOKEN}@github.com/smford/homebrew-tap.git" tap_repo
            mkdir -p tap_repo/Formula
            cp Formula/tf-blast.rb tap_repo/Formula/tf-blast.rb
            cd tap_repo
            git add Formula/tf-blast.rb
            if git commit -m "feat(formula): update tf-blast to ${TAG_NAME}"; then
              git push origin main
              echo "Successfully pushed formula update to smford/homebrew-tap"
            else
              echo "Formula in tap is already up to date"
            fi
            cd ..
            rm -rf tap_repo
          else
            echo "HOMEBREW_TAP_TOKEN secret is not set. Formula uploaded to release assets and local repo."
          fi

      - name: Set up QEMU
        if: steps.semver.outputs.is_new_version == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.semver.outputs.is_new_version == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.semver.outputs.is_new_version == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        if: steps.semver.outputs.is_new_version == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.semver.outputs.version }}
            type=raw,value=${{ steps.semver.outputs.major_tag }}
            type=raw,value=latest

      - name: Build and Push Multi-Arch Container Image
        if: steps.semver.outputs.is_new_version == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.semver.outputs.version }}
            COMMIT_SHA=${{ github.sha }}

      - name: Install Cosign
        if: steps.semver.outputs.is_new_version == 'true'
        uses: sigstore/cosign-installer@v3.8.1

      - name: Sign Container Images with Sigstore Cosign
        if: steps.semver.outputs.is_new_version == 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in ${TAGS}; do
            echo "Signing container image with Cosign: ${tag}"
            cosign sign --yes "${tag}"
          done

