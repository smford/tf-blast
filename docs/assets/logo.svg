<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#0f172a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="1"/>
    </radialGradient>

    <!-- Shield Ring Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Explosion Burst Gradient -->
    <radialGradient id="blastGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#f97316" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#ec4899" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <!-- Cube Faces: Purple/Indigo -->
    <linearGradient id="cubeTop1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="cubeLeft1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="cubeRight1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>

    <!-- Cube Faces: Cyan/Blue -->
    <linearGradient id="cubeTop2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="cubeLeft2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="cubeRight2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Cube Faces: Orange/Amber (Drift & Blast) -->
    <linearGradient id="cubeTop3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="cubeLeft3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="cubeRight3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Disc Base -->
  <circle cx="100" cy="100" r="94" fill="url(#bgGlow)" stroke="#1e293b" stroke-width="2"/>

  <!-- Constrained Blast Radius Ring (Outer Shield) -->
  <circle cx="100" cy="100" r="86" fill="none" stroke="url(#shieldGrad)" stroke-width="3.5" filter="url(#glow)"/>
  
  <!-- Outer Shield Tech Nodes / Tick Marks -->
  <circle cx="100" cy="14" r="3" fill="#38bdf8"/>
  <circle cx="100" cy="186" r="3" fill="#c084fc"/>
  <circle cx="14" cy="100" r="3" fill="#818cf8"/>
  <circle cx="186" cy="100" r="3" fill="#38bdf8"/>
  
  <!-- Calibrated Radius Dashed Ring -->
  <circle cx="100" cy="100" r="76" fill="none" stroke="#6366f1" stroke-width="1.2" stroke-dasharray="4,6" opacity="0.6"/>

  <!-- Radiation Shockwave Burst (Contained within R=76) -->
  <circle cx="100" cy="100" r="64" fill="url(#blastGlow)"/>

  <!-- Explosion Rays (Strictly constrained within perimeter) -->
  <g stroke-linecap="round" opacity="0.85">
    <line x1="100" y1="100" x2="100" y2="28" stroke="#38bdf8" stroke-width="2.5"/>
    <line x1="100" y1="100" x2="155" y2="45" stroke="#f59e0b" stroke-width="2"/>
    <line x1="100" y1="100" x2="172" y2="100" stroke="#ec4899" stroke-width="2.5"/>
    <line x1="100" y1="100" x2="152" y2="152" stroke="#818cf8" stroke-width="2"/>
    <line x1="100" y1="100" x2="100" y2="172" stroke="#38bdf8" stroke-width="2.5"/>
    <line x1="100" y1="100" x2="48" y2="152" stroke="#f59e0b" stroke-width="2"/>
    <line x1="100" y1="100" x2="28" y2="100" stroke="#c084fc" stroke-width="2.5"/>
    <line x1="100" y1="100" x2="45" y2="45" stroke="#38bdf8" stroke-width="2"/>
  </g>

  <!-- Flying Fragment Particles (Exploding outwards) -->
  <polygon points="142,58 147,62 144,67 139,63" fill="#fbbf24"/>
  <polygon points="60,65 65,62 68,68 63,71" fill="#38bdf8"/>
  <polygon points="150,135 155,138 152,144 147,141" fill="#f43f5e"/>
  <polygon points="56,132 61,128 65,134 60,138" fill="#a855f7"/>

  <!-- Terraform Core Geometric Blocks (Erupting from center) -->
  
  <!-- Cube 1: Top Center (Indigo/Purple) -->
  <g transform="translate(100, 72)">
    <!-- Top Face -->
    <polygon points="0,-16 14,-8 0,0 -14,-8" fill="url(#cubeTop1)" stroke="#1e1b4b" stroke-width="0.8"/>
    <!-- Left Face -->
    <polygon points="-14,-8 0,0 0,16 -14,8" fill="url(#cubeLeft1)" stroke="#1e1b4b" stroke-width="0.8"/>
    <!-- Right Face -->
    <polygon points="0,0 14,-8 14,8 0,16" fill="url(#cubeRight1)" stroke="#1e1b4b" stroke-width="0.8"/>
  </g>

  <!-- Cube 2: Center Right (Cyan/Blue - Displaced by blast) -->
  <g transform="translate(122, 102)">
    <!-- Top Face -->
    <polygon points="0,-14 12,-7 0,0 -12,-7" fill="url(#cubeTop2)" stroke="#0c4a6e" stroke-width="0.8"/>
    <!-- Left Face -->
    <polygon points="-12,-7 0,0 0,14 -12,7" fill="url(#cubeLeft2)" stroke="#0c4a6e" stroke-width="0.8"/>
    <!-- Right Face -->
    <polygon points="0,0 12,-7 12,7 0,14" fill="url(#cubeRight2)" stroke="#0c4a6e" stroke-width="0.8"/>
  </g>

  <!-- Cube 3: Center Left (Amber/Orange - High Risk Drift) -->
  <g transform="translate(76, 102)">
    <!-- Top Face -->
    <polygon points="0,-14 12,-7 0,0 -12,-7" fill="url(#cubeTop3)" stroke="#78350f" stroke-width="0.8"/>
    <!-- Left Face -->
    <polygon points="-12,-7 0,0 0,14 -12,7" fill="url(#cubeLeft3)" stroke="#78350f" stroke-width="0.8"/>
    <!-- Right Face -->
    <polygon points="0,0 12,-7 12,7 0,14" fill="url(#cubeRight3)" stroke="#78350f" stroke-width="0.8"/>
  </g>

  <!-- Cube 4: Bottom Center (Core Foundation Anchor) -->
  <g transform="translate(100, 126)">
    <!-- Top Face -->
    <polygon points="0,-16 14,-8 0,0 -14,-8" fill="url(#cubeTop1)" stroke="#1e1b4b" stroke-width="0.8"/>
    <!-- Left Face -->
    <polygon points="-14,-8 0,0 0,16 -14,8" fill="url(#cubeLeft1)" stroke="#1e1b4b" stroke-width="0.8"/>
    <!-- Right Face -->
    <polygon points="0,0 14,-8 14,8 0,16" fill="url(#cubeRight1)" stroke="#1e1b4b" stroke-width="0.8"/>
  </g>

  <!-- Center Core Energy Pulse -->
  <circle cx="100" cy="100" r="6" fill="#ffffff" filter="url(#glow)"/>
</svg>
